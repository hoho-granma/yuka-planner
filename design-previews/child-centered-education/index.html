const interestKey='hannun-preview:interests:v1:sua';let savedOnly=false,interestedAcademies=new Set(),interestNotice='';try{const stored=JSON.parse(localStorage.getItem(interestKey)||'[]');if(Array.isArray(stored))interestedAcademies=new Set(stored.filter(x=>typeof x==='string'));}catch(e){interestNotice='관심 학원 저장 내용을 읽지 못했어요.';}function persistInterests(next){try{localStorage.setItem(interestKey,JSON.stringify([...next]));interestedAcademies=next;interestNotice='';return true;}catch(e){interestNotice='이 기기에 저장하지 못했어요. 브라우저 저장 설정을 확인해 주세요.';return false;}}
let activityOpen=false,statusOpen=false,insightOpen=false;let recordFilter='전체',paperSubject='수학',paperStage='before';let category="수학", selectedCandidates=new Set(), selectedGroup="academy", searchText="";let menu='growth',tab='current';const app=document.getElementById('app');
const childSummary=`<section class="card hero"><div class="eyebrow">비교의 기준 · 우리 아이</div><h2>수아는 지금</h2><div class="stats"><div><strong>3</strong><small>등록 교육·활동 일정</small></div><div><strong>미점검</strong><small>교과 이해 확인</small></div></div><div class="chips"><span>영도</span><span>미술</span><span>뮤지컬</span></div><p class="note">일정 등록 기준이며 실제 참여·기관 수를 뜻하지 않아요. 학습 수준은 별도 수행 기록이 필요해요.</p><button class="link" data-go="growth:current">수아의 현재 상태와 근거 보기 →</button></section>`;
function current(){return `<section class="card hero"><div class="eyebrow">수아의 현재 상태</div><h2>기록은 모였어요.<br>교과 이해는 아직 확인 전이에요.</h2><p>국제초 경험과 공립 교육과정은 다를 수 있어요. 공립 초3 교육과정의 일부 내용을 직접 확인해볼 수 있어요.</p><div class="stats"><div><strong>4건</strong><small>서버에 보관된 기록</small></div><div><strong>미점검</strong><small>교과 이해 확인</small></div></div><small>기록 수는 실력이나 성장 정도를 의미하지 않아요.</small></section><section class="card"><h2>과목별 현재 상태</h2><p class="muted">확인한 범위만 보여주고, 아직 모르는 부분은 남겨둬요.</p>${['국어','수학','사회','영어','과학'].map(s=>`<div class="row"><div><h3>${s}</h3><small>수아의 수행 답변 없음</small></div><button class="link" data-detail="${s} 일부 내용 확인">확인하기 →</button></div>`).join('')}<p class="note">교육부 교육과정 기반 문항 후보 · 교사 검토 필요. 전체 학년 수준을 판정하는 검사가 아니에요.</p></section><section class="card"><h2>현재 교육·활동</h2><div class="chips"><span>영도 · 등록 일정</span><span>미술 · 등록 일정</span><span>뮤지컬 · 등록 일정</span></div><p>READ101 판교점 · 부모가 확인한 기관</p><small>‘영도’와 READ101은 연결이 확인되지 않아 별도로 표시해요.</small><button class="link" data-go="education:choice">수아의 교육 선택지 보기 →</button></section><section class="card"><h2>지금 더 확인할 것</h2><p>독서 기록과 결과물이 있어요. 실제 수행 날짜와 도움받은 정도를 확인하면 기록을 더 정확히 이해할 수 있어요.</p><button class="link" data-go="growth:history">근거가 된 성장 이력 보기 →</button></section>`}
const fixtureScope='design-only-sua';

function paperCard(){return `<section class="card paper-card compact-panel"><div class="compact-head"><h2>교과 이해 확인</h2><span class="pill">3학년 2학기</span></div><div class="filters">${['국어','수학','사회','영어','과학'].map(x=>`<button data-paper-subject="${x}" class="${paperSubject===x?'active':''}">${x}</button>`).join('')}</div><p class="history-empty">기존 측정이력이 없습니다.</p><div class="actions"><button class="primary" data-paper-action="print">문제지 보기/인쇄</button><button class="secondary" data-paper-action="register">결과 등록</button></div><details class="check-note"><summary>확인 기준 안내</summary><p>공립 교육과정 참고용 문항 후보예요. 수아의 실제 학교 진도를 뜻하지 않으며 학기별 대응은 검토 중이에요. 일부 문항으로 학년 전체 수준을 판단하지 않아요.</p></details></section>`}
function history(){const group=GrowthRecords.GROUPS.find(x=>x.id===selectedGroup);const records=fixtureRecords.filter(x=>x.group===selectedGroup);return `<p class="note">잎을 눌러 활동을 선택하세요.</p>${GrowthRecords.treeMarkup(fixtureRecords,fixtureScope,[],'수아',activityOpen?selectedGroup:'','').replace('icons/growth/','../../icons/growth/')}<div class="compact-sections"><button class="disclosure" data-activity-toggle aria-expanded="${activityOpen}"><span>활동기록 상세보기${activityOpen?' · '+group.label:''}</span><span aria-hidden="true">${activityOpen?'⌃':'→'}</span></button>${activityOpen?`<section class="gr-records compact-panel"><div class="gr-section-head"><h3>${group.label}의 기록</h3><button class="link" data-detail="오늘의 성장 남기기">＋ 기록</button></div><div class="filters">${['전체','피드백','결과물','교과 확인'].map(x=>`<button data-record-filter="${x}" class="${recordFilter===x?'active':''}">${x}</button>`).join('')}</div><div class="gr-timeline">${recordFilter==='전체'?records.map(r=>`<article class="gr-record"><time>${r.date}</time><span class="gr-activity-label">${r.activity}</span><h4>${r.title}</h4><button class="link" data-detail="기록 원문과 맥락">기록 보기 →</button></article>`).join('')||'<p class="history-empty">아직 기록이 없어요.</p>':`<p class="history-empty">${recordFilter==='교과 확인'?'기존 측정이력이 없습니다.':'기록 유형 확인 후 표시해요.'}</p>`}</div></section>`:''}<button class="disclosure" data-status-toggle aria-expanded="${statusOpen}"><span>현재 상태 확인</span><span aria-hidden="true">${statusOpen?'⌃':'→'}</span></button>${statusOpen?paperCard():''}<button class="disclosure" data-insight-toggle aria-expanded="${insightOpen}"><span>기록과 관련된 교육정보</span><span aria-hidden="true">${insightOpen?'⌃':'→'}</span></button>${insightOpen?`<section class="card compact-panel"><p>독서 활동의 수업·피드백 비교 기준을 살펴봐요.</p><button class="link" data-go="education:choice">교육 선택지 보기 →</button></section>`:''}</div>`}
function peers(){return childSummary+`<section class="card"><div class="eyebrow">또래·지역 참고</div><h2>비슷한 학년은 어떻게 하고 있나요?</h2><p class="muted">수아의 교육 참여와 공개 통계를 같은 기준일 때만 비교해요.</p>${['교육 참여','주당 교육시간','월 교육비'].map((s,i)=>`<div class="row" style="display:block"><h3>${s}</h3><div class="compare"><div><small>수아</small><strong>${i===0?'등록 일정 3개':'확인 전'}</strong><small>${i===0?'참여율과 직접 비교 불가':'실제 참여 기준 필요'}</small></div><div><small>공식 또래 통계</small><strong>자료 검증 전</strong><small>학년·지역·분모 확인 필요</small></div></div></div>`).join('')}<small>KOSIS 응답·수치 대조 전에는 수치나 비교 결과를 보여주지 않아요. 시도 통계는 시도로 표시하며 성남시 평균으로 바꾸지 않아요.</small></section><section class="card"><h2>수아의 학습 수준은?</h2><p>또래 참여율·비용으로 알 수 없어요. 성장기록의 직접 수행 자료에서 확인한 범위를 볼 수 있어요.</p><button class="link" data-go="growth:current">수아의 교과 확인 상태 보기 →</button></section><section class="card"><h2>성남시 교육환경</h2><p>지역 기관·공공 프로그램의 분포는 선택 가능한 환경을 뜻해요. 많은 아이가 이용한다는 의미는 아니에요.</p><button class="link" data-go="education:choice">지역 선택지와 비교 기준 →</button></section>`}
const demoAcademies=[
{id:'math-a',subject:'수학',name:'수학 A학원 · 예시 지점',kind:'개념 설명 · 소그룹',info:'초등 대상 · 수업 시간·비용·위치 확인 자리',positive:'개념을 말로 설명하게 한다는 의견이 반복돼요.',negative:'숙제를 마치는 데 시간이 걸렸다는 의견도 있어요.',questions:'숙제 예상 시간은? 아이가 이해한 내용을 어떻게 확인하나요?'},
{id:'math-b',subject:'수학',name:'수학 B교습소 · 예시 지점',kind:'개별 진도 · 연산과 문제 풀이',info:'초등 대상 · 수업 시간·비용·위치 확인 자리',positive:'아이별 진도를 조절한다는 언급이 있어요.',negative:'피드백 빈도에 대한 의견은 서로 달라요.',questions:'진도 조절 기준은? 보호자에게 피드백은 얼마나 자주 오나요?'},

{id:'jump-a',subject:'줄넘기',name:'줄넘기 E센터 · 예시 지점',kind:'기초 동작 · 운동 활동',info:'초등 대상 · 시간·비용·차량 확인 자리',positive:'동작을 나눠 알려준다는 의견이 있어요.',negative:'수업 인원과 차량 대기 관련 의견도 있어요.',questions:'한 반 인원은? 초보 아이의 운동 강도는 어떻게 조절하나요?'}];
function academyCard(a){return `<article class="card"><div class="academy-head"><div><span class="badge">${a.subject} · 가상 기관</span><h2>${a.name}</h2><p>${a.kind}</p></div><span class="avatar">${a.subject==='줄넘기'?'↗':'✎'}</span></div><p class="note"><span class="source">공식정보 자리</span> ${a.info}</p><div class="opinions"><h3>부모들이 주로 이야기하는 점</h3><span class="source">가상 의견 · 실제 맘카페 수집 아님</span><p>＋ ${a.positive}</p><p>↔ ${a.negative}</p><small>실제 서비스: 서로 다른 작성자·중복 제외 의견 수 / 기간 / 출처 / 상반된 의견 표시</small></div><button class="link" data-interest="${a.id}" aria-pressed="${interestedAcademies.has(a.id)}">${interestedAcademies.has(a.id)?'♥ 관심 학원 저장됨':'♡ 관심 학원 저장'}</button><div class="actions"><button class="secondary" data-candidate="${a.id}">${selectedCandidates.has(a.id)?'✓ 비교에 담음':'＋ 비교에 담기'}</button><button class="primary" data-academy="${a.id}">정보 자세히</button></div></article>`}
function choice(){let matches=demoAcademies.filter(a=>(savedOnly?interestedAcademies.has(a.id):a.subject===category)&&(!searchText||a.name.includes(searchText)||a.kind.includes(searchText)));return `<section class="card hero" style="padding:15px"><span class="eyebrow">수아 · 초3 · 성남시</span><h3>어떤 교육을 알아보고 있나요?</h3><p class="note">수아의 현재 기관: READ101 판교점 · 등록 활동은 성장기록에서 확인</p><button class="link" data-go="growth:history">수아의 실제 경험 보기 →</button></section><div class="tabs"><button data-interest-view="all" class="${!savedOnly?'active':''}">학원 찾기</button><button data-interest-view="saved" class="${savedOnly?'active':''}">관심 학원 ${demoAcademies.filter(a=>interestedAcademies.has(a.id)).length}</button></div><p class="note" role="status">${interestNotice||'관심 학원은 이 기기에 저장돼요. 가족·다른 기기와 공유되지 않아요.'}</p><div class="filters">${['수학','영어','과학','줄넘기','국어·독서','예체능'].map(x=>`<button data-category="${x}" class="${category===x?'active':''}">${x}</button>`).join('')}</div><input class="search" id="academy-search" placeholder="학원 이름 또는 수업 방식 찾기" value="${searchText.replaceAll('&','&amp;').replaceAll('"','&quot;')}"><div class="filters"><button data-detail="거리·이동 필터">거리·이동 ▾</button><button data-detail="비용 필터">비용 ▾</button><button data-detail="수업 방식 필터">수업 방식 ▾</button><button data-detail="차량 여부 필터">차량 ▾</button></div><p><b>${savedOnly?'저장한 관심 학원':category+' 선택지'}</b> <span class="muted">${matches.length}개 시안 예시</span></p><p class="note">아래 기관·의견은 모두 화면 구성을 위한 가상 예시입니다. 실제 학원 추천·순위가 아니에요.</p>${matches.map(academyCard).join('')||(savedOnly?'<section class="card"><h3>저장한 관심 학원이 없어요</h3><p>학원 찾기에서 관심 있는 곳을 저장해 주세요.</p></section>':'<section class="card"><h3>선택지 카드가 들어갈 자리예요</h3><p>실제 기관 정보가 확보되면 보여줘요.</p></section>')}<div class="comparebar"><span>비교 후보 ${selectedCandidates.size}곳</span><button class="primary" data-compare>나란히 비교</button></div><p class="note">많이 언급됐다는 사실이 좋은 학원이라는 뜻은 아니에요. 비용·수업·의견을 모아 부모가 직접 선택할 수 있도록 정리해요.</p>`}
function openAcademy(id){const a=demoAcademies.find(x=>x.id===id);document.getElementById('detail-title').textContent=a.name;document.getElementById('detail-text').innerHTML=`<div class="dialogbody"><span class="source">모든 내용은 가상 예시</span><h3>공식정보</h3><p>${a.kind}</p><p>${a.info}</p><p class="note">실제 서비스: 등록정보·분야·주소·교습비 공개 범위 / 기관 안내 / 확인일 / 출처 링크</p><h3>이용자 의견</h3><p>${a.positive}</p><p>${a.negative}</p><p class="note">실제 서비스: 의견 수·기간·출처를 표시하고 원문으로 연결. 로그인 제한 글은 임의 수집하지 않아요.</p><h3>상담에서 확인할 것</h3><p>${a.questions}</p><button class="secondary" data-detail="상담·체험 일정 연결">상담·체험 선택 → 가족 일정</button></div>`;document.getElementById('detail').showModal()}
function openCompare(){const items=demoAcademies.filter(x=>selectedCandidates.has(x.id));document.getElementById('detail-title').textContent='후보를 나란히 비교';document.getElementById('detail-text').innerHTML=`<div class="dialogbody comparison">${items.map(a=>`<article><h3>${a.name}</h3><p><b>수업</b> ${a.kind}</p><p><b>비용·이동</b> 실제 정보 확인 전</p><p><b>의견에서 반복된 점</b> ${a.positive}</p><p><b>다른 의견</b> ${a.negative}</p><p><b>확인할 질문</b> ${a.questions}</p></article>`).join('')||'<p>학원 카드에서 비교할 후보를 먼저 담아주세요.</p>'}<small>가상 예시 · 자동 적합도 점수·추천 순위 없음</small></div>`;document.getElementById('detail').showModal()}
function render(){const growth=menu==='growth';app.className=growth?'growth':'education';app.innerHTML=`<header><div><span class="eyebrow">한눈육아</span><h1>${growth?'성장기록':'교육정보'}</h1></div><span class="pill">수아 · 초3</span></header><p class="muted">${growth?'경험을 남기고, 기록에서 수아를 이해해요.':'수아를 기준으로 또래와 지역의 선택지를 살펴봐요.'}</p><small>국제초 · 경기도 성남시 · 수아 기준 설계 시안</small>${growth?'':`<div class="tabs">${[['peers','또래·지역'],['choice','교육 선택']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</div>`}${growth?history():({peers,choice})[tab]()}`;document.querySelectorAll('[data-menu]').forEach(b=>b.classList.toggle('active',b.dataset.menu===menu));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.interestView){savedOnly=b.dataset.interestView==='saved';searchText='';render();return;}if(b.dataset.interest){const next=new Set(interestedAcademies);next.has(b.dataset.interest)?next.delete(b.dataset.interest):next.add(b.dataset.interest);persistInterests(next);const y=window.scrollY;render();window.scrollTo(0,y);return;}if(b.hasAttribute('data-activity-toggle')){activityOpen=!activityOpen;render();return;}if(b.hasAttribute('data-insight-toggle')){insightOpen=!insightOpen;render();return;}if(b.hasAttribute('data-status-toggle')){statusOpen=!statusOpen;render();return;}if(b.dataset.recordFilter){recordFilter=b.dataset.recordFilter;render();return;}if(b.dataset.paperSubject){paperSubject=b.dataset.paperSubject;paperStage='before';const y=window.scrollY;render();window.scrollTo(0,y);return;}if(b.dataset.paperAction){const act=b.dataset.paperAction;document.getElementById('detail-title').textContent=act==='print'?paperSubject+' 문제지 보기':'부모 확인과 근거 보존';document.getElementById('detail-text').innerHTML=act==='print'?'<p>문항・과목 선택 후 아이용 문제지만 인쇄해요. 현재는 검토 전 후보입니다.</p><a href="../subject-review/" target="_blank" rel="noopener">5과목 문제지 열기 →</a>':'<p><b>'+paperSubject+' · 3학년 2학기 참고</b></p><p>푼 답안 사진이나 파일을 올리고 실제 수행 날짜·받은 도움을 확인하는 화면으로 연결합니다.</p><p>원래 답안을 보존하고 확인 기준과 대조한 결과를 별도 기록해요.</p><small>이 시안에서는 실제 업로드·평가·저장을 하지 않아요.</small>';document.getElementById('detail').showModal();return;}if(b.dataset.category){savedOnly=false;category=b.dataset.category;searchText='';render();return;}if(b.dataset.candidate){if(selectedCandidates.has(b.dataset.candidate)){selectedCandidates.delete(b.dataset.candidate);interestNotice='';}else if(selectedCandidates.size<3){selectedCandidates.add(b.dataset.candidate);interestNotice='';}else{interestNotice='한 번에 최대 3곳까지 비교할 수 있어요.';}const y=window.scrollY;render();window.scrollTo(0,y);return;}if(b.dataset.academy){openAcademy(b.dataset.academy);return;}if(b.hasAttribute('data-compare')){openCompare();return;}if(b.dataset.menu){activityOpen=false;statusOpen=false;insightOpen=false;menu=b.dataset.menu;tab=menu==='growth'?'current':'peers';render();window.scrollTo(0,0)}if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0)}if(b.dataset.go){[menu,tab]=b.dataset.go.split(':');if(menu==='growth'){activityOpen=tab==='history';statusOpen=tab==='current';}render();window.scrollTo(0,0)}if(b.dataset.detail){document.getElementById('detail-title').textContent=b.dataset.detail;document.getElementById('detail-text').textContent=b.dataset.detail==='거리·이동 필터'?'집·학교에서의 거리, 도보·차량 이동, 셔틀 정류장을 기준으로 좁힙니다. 실제 주소와 차량 운영 확인 후 제공합니다.':b.dataset.detail==='비용 필터'?'월 교습비와 별도 교재·재료비를 구분해 예산 범위를 선택합니다. 미공개 금액은 확인 필요로 남깁니다.':b.dataset.detail==='수업 방식 필터'?'소그룹 / 개별 진도 / 설명·토론 / 실험·체험 등 확인된 수업 방식으로 선택합니다.':b.dataset.detail==='차량 여부 필터'?'차량 운영 여부와 수아가 이용 가능한 정류장·시간을 별도로 확인합니다.':b.dataset.detail==='상담·체험 일정 연결'?'후보 기관의 상담·체험을 선택한 뒤 날짜를 확인해 가족 일정에 연결합니다. 이 시안은 실제 신청·일정 저장을 하지 않습니다.':b.dataset.detail==='기관 비교 화면'?'기관·지점별로 공식 출처/확인일, 과정, 비용, 이동, 피드백을 나란히 표시해요. 이용자 의견은 별도로 의견 수·시점·상반된 의견을 보여줘요. 특정 기관을 최적이라고 판정하지 않아요.':'이 화면은 메뉴 구조 시안이에요. 실제 답변 수집이나 원문 조회는 하지 않아요. 상태 점검은 성장기록에서만 진행하고 결과도 같은 곳에 보관해요.';document.getElementById('detail').showModal()}});document.addEventListener('click',e=>{const leaf=e.target.closest('[data-gr-group]');if(leaf){activityOpen=!(activityOpen&&selectedGroup===leaf.dataset.grGroup);selectedGroup=leaf.dataset.grGroup;recordFilter='전체';render();}});document.addEventListener('keydown',e=>{const leaf=e.target.closest('[data-gr-group]');if(leaf&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activityOpen=!(activityOpen&&selectedGroup===leaf.dataset.grGroup);selectedGroup=leaf.dataset.grGroup;recordFilter='전체';render();}});document.addEventListener('change',e=>{if(e.target.id==='academy-search'){searchText=e.target.value;render();}});render();
</script></body></html>
