<style>
body{background:#e6e3de!important;padding:22px 16px 60px;margin:0}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:#6f6c74;margin:0 0 18px;line-height:1.6;max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}.col{width:372px}.cap{font-size:15px;font-weight:800;margin:0 0 3px}.why{font-size:12px;color:#6f6c74;line-height:1.55;margin:0 0 10px;min-height:56px}

/* 카테고리 4개 */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.cats button{font:inherit;border:1px solid var(--line);background:var(--surface,#fff);border-radius:14px;padding:9px 2px 8px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.cats button b{font-size:13px}.cats button span{font-size:11px;color:var(--text-muted)}
.cats button.on{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--on-accent)}.cats button.on span{color:var(--on-accent);opacity:.85}

.gr-timeline{margin-left:4px;padding-left:14px}

.stat3{display:flex;gap:8px;margin:0 0 10px}.stat3 div{flex:1;background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center}.stat3 b{display:block;font-size:17px}.stat3 span{font-size:10.5px;color:var(--text-muted)}

.dock{position:sticky;bottom:-90px;margin:0 -14px;padding:24px 14px 16px;background:linear-gradient(transparent,var(--bg,#f4f3f1) 40%);z-index:3}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent-dark);color:var(--on-accent);font:inherit;font-size:15px;font-weight:800;padding:14px;text-align:center}
.btn.ghost{background:var(--surface,#fff);color:var(--accent-dark);border:1px solid var(--accent-dark)}
.inp{border:1px solid var(--line);border-radius:12px;background:var(--surface,#fff);padding:11px;font-size:13px;color:var(--text-muted)}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.big4 button{font:inherit;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--surface,#fff);padding:12px;color:var(--text);display:block}.big4 b{font-size:15px;display:block}.big4 span{font-size:12px;color:var(--text-muted)}.big4 em{font-style:normal;float:right;font-size:20px;font-weight:800;color:var(--accent-dark)}.big4 button.on{border:2px solid var(--accent-dark);background:var(--nd-soft);padding:11px}
.quick{display:flex;gap:8px;margin:0 0 12px}.quick .inp{flex:1}.quick .btn{width:auto;padding:0 16px;font-size:14px}

.tabs-u{display:flex;border-bottom:1px solid var(--line);margin:0 0 12px}.tabs-u button{flex:1;font:inherit;font-size:14px;font-weight:700;border:0;background:none;padding:11px 0 10px;color:var(--text-muted);border-bottom:3px solid transparent;margin-bottom:-1px}.tabs-u button small{font-weight:600;margin-left:3px;font-size:11px}.tabs-u button.on{color:var(--accent-dark);border-bottom-color:var(--accent-dark)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.tags button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface,#fff);color:var(--text)}.tags button.on{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--on-accent)}.tags button em{font-style:normal;opacity:.75;font-weight:700;margin-left:2px}
.tags button.add{border:1px dashed var(--accent-dark);color:var(--accent-dark);background:transparent;font-weight:800}.tags button.add.solid{background:var(--accent-dark);color:var(--on-accent);border-style:solid}
.calbtn{display:block;width:100%;min-height:44px;margin:0 0 14px;padding:10px;border-radius:12px;border:1px solid var(--nd-soft);background:var(--nd-soft);color:var(--nd-ink,var(--accent-dark));font:inherit;font-size:13px;font-weight:700;text-align:center}
.seg2{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0}.seg2 button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);border-bottom:0;background:var(--nd-soft);color:var(--text-muted);padding:10px 0;border-radius:12px 12px 0 0;margin-right:-1px}.seg2 button.on{background:var(--surface,#fff);color:var(--accent-dark);position:relative;z-index:1;padding-bottom:11px;margin-bottom:-1px}.seg2 small{font-weight:600;margin-left:2px;font-size:11px}
.panel{background:var(--surface,#fff);border:1px solid var(--line);border-radius:0 0 16px 16px;padding:14px 12px 6px;margin:0 0 10px}.panel .gr-record{background:var(--bg,#f4f3f1)}
.sticky-tabs{position:sticky;top:46px;z-index:2;background:var(--bg,#f4f3f1);padding-bottom:2px}
</style><body class="acct-design theme-warm"><h1>성장기록 메뉴 UX 시안 v3</h1>
<p class=sub>공통: 나무 유지 · 분류 탭(학교·학원·가정활동·그 외, 기본 학원) · 선택된 탭 아래 활동 태그(덜 둥근 버튼, 개수 포함, 첫 번째 기본 선택) · 태그 줄 끝 "＋ 성장기록 남기기"(옛 활동추가 자리) · 태그 아래 홈과 같은 꽉 찬 "이후 일정은 가족 캘린더에서 보기 ›" 버튼 · 그 밑에 "리드101의 기록" 타임라인. 폰 화면은 안에서 스크롤됩니다.</p>
<div class=row id=row></div>
<script src="file:///Users/hhhhp/Documents/10-workspaces/14-육아지기/04-자체서비스/한눈육아/js/growth-evidence.js"></script><script src="file:///Users/hhhhp/Documents/10-workspaces/14-육아지기/04-자체서비스/한눈육아/js/growth-records.js"></script>
<script>
var G=GrowthRecords,S='s';
var CATS=[['academy','학원',13,[['리드101',8],['피아노',3],['수영',2]]],['home','가정활동',5,[['독서',5]]],['school','학교',4,[['학교생활',4]]],['activity','그 외활동',1,[['숲 체험',1]]]];
function recs(g,a){var r=[];CATS.forEach(function(c){c[3].forEach(function(x){for(var i=0;i<x[1];i++)r.push({id:c[0]+x[0]+i,scope:S,group:c[0],activity:x[0],title:'t',text:'x',date:'2026-10-0'+(1+i%9),createdAt:i});});});return r;}
var base=base=recs();
function tree(sel,mini){return '<div class="'+(mini?'mini-tree':'')+'">'+G.treeMarkup(base,S,[],'은찬',sel,'')+'</div>';}
var TL=[['10.09','리드101','Unit 5 단어시험 90점','선생님: 이번 주 단어를 거의 다 외웠어요. 발음도 또렷해졌어요.',1],['10.07','리드101','읽기 숙제 끝까지 완료','선생님 메시지 캡처',1],['10.02','리드101','리딩 레벨 상승','Level 2 → Level 3 으로 올라갔어요.',0]];
function timeline(name,n){return '<div class=tlh><h3>'+name+'의 기록</h3><span>'+n+'개의 순간</span></div><div class=gr-timeline>'+TL.map(function(t){return '<article class=gr-record><time>2026.'+t[0]+'</time><span class=gr-activity-label>'+t[1]+'</span><h4>'+t[2]+'</h4><p>'+t[3]+'</p>'+(t[4]?'<div class=thumb>🖼 캡처 사진 미리보기</div>':'')+'<button class=gr-edit>기록 수정</button></article>';}).join('')+'<p class=gr-empty style="padding:6px">아래로 더 있어요 · 8개 중 3개 표시</p></div>';}

var NAMES=[['school','학교',4],['academy','학원',13],['home','가정활동',5],['activity','그 외',1]];
function tabsU(){return '<div class=tabs-u>'+NAMES.map(function(n){return '<button class="'+(n[0]=='academy'?'on':'')+'">'+n[1]+'<small>'+n[2]+'</small></button>';}).join('')+'</div>';}
function tabsSeg(){return '<div class=seg>'+NAMES.map(function(n){return '<button class="'+(n[0]=='academy'?'on':'')+'">'+n[1]+'<small>'+n[2]+'</small></button>';}).join('')+'</div>';}
function tabsFolder(){return '<div class=seg2>'+NAMES.map(function(n){return '<button class="'+(n[0]=='academy'?'on':'')+'">'+n[1]+'<small>'+n[2]+'</small></button>';}).join('')+'</div>';}
function tags(solid){return '<div class=tags>'+CATS[0][3].map(function(x,i){return '<button class="'+(i==0?'on':'')+'">'+x[0]+'<em>('+x[1]+')</em></button>';}).join('')+'<button class="add'+(solid?' solid':'')+'">＋ 성장기록 남기기</button></div>';}
function calbtn(){return '<button class=calbtn>이후 일정은 가족 캘린더에서 보기 ›</button>';}
function stat(){return '<div class=card><h3>현재 상태 확인 <span>3학년 2학기</span></h3><div class=subj><div class=on>수학<small>답안 2건</small></div><div>국어<small>기록 없음</small></div><div>영어<small>기록 없음</small></div><div>과학<small>기록 없음</small></div></div><p style="margin:8px 0 0;font-size:12px;color:var(--text-muted)">수학 최근 10.05 · 수준 판정 아님 &nbsp;<b style="color:var(--accent-dark)">문제지 · 결과 등록 ›</b></p></div>';}
function pill(){return '<div class=pill>📈 <span><b>수학</b> 답안 2건 · 최근 10.05</span><span class=go>상태 확인 ›</span></div>';}
var V=[
['A. 밑줄 탭','나무(현재 크기) → 상태 한 줄 → 밑줄 탭 → 태그(덜 둥근) + 성장기록 남기기 → 캘린더 버튼 → 기록 타임라인. 가장 가볍고 현재 모습과 가까움.',
 '<div class=apptop>성장기록</div>'+tree('academy',0)+pill()+tabsU()+tags(0)+calbtn()+timeline('리드101',8)],
['B. 세그먼트 탭','나무를 작게 줄여 기록이 더 빨리 보임. 탭은 알약 모양 세그먼트. 성장기록 남기기는 색을 채운 태그로 강조. 상태는 타임라인 아래 카드.',
 '<div class=apptop>성장기록</div>'+tree('academy',1)+tabsSeg()+tags(1)+calbtn()+timeline('리드101',8)+stat()],
['C. 폴더 탭 + 한 덩어리 패널','탭이 폴더처럼 아래 패널과 이어져, 태그·캘린더 버튼·타임라인이 선택한 분류에 속한다는 게 분명함. 상태 카드는 나무 아래.',
 '<div class=apptop>성장기록</div>'+tree('academy',0)+stat()+tabsFolder()+'<div class=panel>'+tags(0)+calbtn()+timeline('리드101',8)+'</div>'],
['D. 탭 고정(스크롤해도 유지)','분류 탭이 위에 붙어 있어 타임라인을 내려도 분류를 바꿀 수 있음. 기록이 길 때 유리. 나무는 작게, 상태는 한 줄.',
 '<div class=apptop>성장기록</div>'+tree('academy',1)+pill()+'<div class=sticky-tabs>'+tabsU()+'</div>'+tags(0)+calbtn()+timeline('리드101',8)+'<div style="height:200px"></div>']
];
document.getElementById('row').innerHTML=V.map(function(v){return '<div class=col><p class=cap>'+v[0]+'</p><p class=why>'+v[1]+'</p><div class=ph>'+v[2]+'</div></div>';}).join('');
</script></html>
