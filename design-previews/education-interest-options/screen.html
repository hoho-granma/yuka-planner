<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교육 선택 컴팩트 시안</title><style>
:root{--bg:#f4f2f7;--fg:#302c3c;--accent:#715697;--soft:#e9e1f3;--line:#e5dfec;--muted:#827a8a}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}h1{font-size:23px;letter-spacing:-.7px;margin:20px 0 16px}.brand{font-size:19px;font-weight:800;letter-spacing:-.6px}.tabs{display:flex;background:#ece7f1;padding:4px;gap:4px;border-radius:10px;margin-bottom:18px}.tabs button{flex:1;border:0;padding:11px 6px;background:transparent;font-size:13px;border-radius:8px}.tabs .on{background:white;font-weight:700;box-shadow:0 1px 4px #302c3c08}.region{display:flex;align-items:center;gap:6px;margin-bottom:10px}.region select{border:0;background:transparent;font-size:14px;font-weight:700;max-width:210px;padding:4px 0}.region small{margin-left:auto;color:var(--muted);font-size:11px}.search{position:relative;margin:0 0 9px}.search span{position:absolute;left:13px;top:11px;color:var(--muted)}input[type=search]{width:100%;padding:11px 12px 11px 35px;border:1px solid var(--line);border-radius:10px;background:white;font-size:12px;outline-color:var(--accent)}.filters{display:flex;gap:8px;margin-bottom:14px}.filters select{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;flex:1;min-width:0}.chips{display:flex;gap:6px;overflow:auto;scrollbar-width:none;padding:0 0 12px}.chips button{white-space:nowrap;padding:7px 11px;border:1px solid var(--line);background:white;border-radius:20px;font-size:12px}.chips .on{background:var(--accent);color:white;border-color:var(--accent)}.row{display:flex;align-items:center;gap:10px;border:0;background:white;text-align:left;width:100%;padding:15px 13px;border-bottom:1px solid var(--line)}.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden}.row:last-child{border-bottom:0}.icon{width:35px;height:35px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:10px;background:#f2edf7;color:var(--accent);font-size:13px;font-weight:700}.info{flex:1;min-width:0}.info strong{font-size:13px;line-height:1.5;display:block;letter-spacing:-.3px}.info small{display:block;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}.arrow{font-size:20px;color:#aaa2b2}.note{font-size:10px;color:var(--muted);line-height:1.7;margin:11px 2px 16px}.public{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:15px}.public h2{font-size:13px;margin:0 0 6px}.public p{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 8px}.public a{font-size:11px;color:var(--accent);text-decoration:none;margin-right:9px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{text-align:left;border:1px solid var(--line);border-radius:13px;background:white;padding:13px;min-height:132px;display:flex;flex-direction:column;align-items:flex-start}.tile .tag{background:var(--soft);color:var(--accent);font-size:10px;padding:4px 6px;border-radius:5px;margin-bottom:9px}.tile strong{font-size:13px;line-height:1.5;letter-spacing:-.3px}.tile small{font-size:10px;color:var(--muted);margin-top:auto;padding-top:9px}.group{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white;margin-bottom:9px}.group summary{padding:14px;cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;justify-content:space-between}.group summary::after{content:'⌄';color:var(--muted)}.group summary em{font-style:normal;font-size:11px;color:var(--muted);margin-left:7px}.group .row{padding:12px 14px;background:#fcfbfd;border-top:1px solid var(--line)}.group .row .icon{display:none}dialog{border:0;border-radius:18px;padding:20px;width:calc(100% - 24px);max-width:390px;max-height:90vh;color:var(--fg)}dialog::backdrop{background:#302c3c66}.close{float:right;border:0;background:#f2edf7;border-radius:50%;width:28px;height:28px}.detail-tag{font-size:11px;color:var(--accent);margin:4px 0 10px}.detail-title{font-size:20px;line-height:1.4;margin:0 0 10px}.address{font-size:12px;color:var(--muted);line-height:1.6}.facts{font-size:12px;line-height:1.6}.facts div{border-top:1px solid var(--line);padding:10px 0}.facts dt{font-weight:700;margin-bottom:4px}.facts dd{margin:0;color:#706678}.questions{font-size:12px;line-height:1.8;padding-left:16px}.action{display:block;border:0;background:var(--accent);color:white;border-radius:9px;width:100%;padding:12px;font-size:13px;margin-top:12px}dialog a{color:var(--accent);font-size:12px}.empty{font-size:12px;line-height:1.8;padding:20px;background:white;border-radius:12px}
.interest-row{display:flex;background:white;border-bottom:1px solid var(--line)}.interest-row:last-child{border:0}.interest-row .row{border:0;flex:1;min-width:0}.bookmark{flex:none;width:44px;border:0;background:white;color:#a29aa9;font-size:23px;cursor:pointer}.bookmark.on{color:var(--accent)}.collection{border:1px solid var(--line);background:white;color:var(--accent);padding:12px 14px;border-radius:12px;display:block;width:100%;text-align:left;font-size:13px;margin:8px 0 14px}.collection b{float:right;background:var(--soft);padding:1px 7px;border-radius:9px}.detail-save{background:var(--soft);border:0}.floating{position:fixed;bottom:15px;left:16px;right:16px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:white;box-shadow:0 5px 18px #302c3c22;font-size:13px}body{padding-bottom:85px}
.compare-check{display:flex;align-items:center;padding-left:10px;flex:none}.compare-check input{width:18px;height:18px;accent-color:var(--accent)}.compare-dock{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:10px 16px;box-shadow:0 -3px 15px #302c3c08}.compare-dock small{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.compare-dock button{width:100%;border:0;border-radius:10px;background:var(--accent);color:white;padding:12px;font-size:13px}.compare-dock button:disabled{background:#e9e5ed;color:#8b8393;cursor:default}.compare-dialog{max-width:860px}.comparison-scroll{overflow:auto;max-height:65vh}.comparison-scroll table{border-collapse:collapse;table-layout:fixed;width:max-content;font-size:12px;line-height:1.6}.comparison-scroll th,.comparison-scroll td{width:185px;max-width:185px;padding:12px;border:1px solid var(--line);vertical-align:top;text-align:left;overflow-wrap:anywhere}.comparison-scroll th:first-child{width:90px;max-width:90px;position:sticky;left:0;background:#f8f5fb}.comparison-scroll thead th{background:var(--soft);color:var(--accent)}
</style><div class="brand">한눈육아</div><h1>교육정보</h1><div class="tabs"><button id="peer">또래·지역</button><button class="on">교육 선택</button></div><div class="region"><span>⌖</span><select aria-label="조회 지역" id="region"><option value="seongnam">경기도 성남시</option><option value="none">다른 지역</option></select><small id="count"></small></div><div class="search"><span>⌕</span><input id="query" type="search" placeholder="기관명·주소 검색" aria-label="기관명·주소 검색"></div><div id="interest-control"></div><div id="filters"></div><p id="compare-notice" class="note" role="status" aria-live="polite"></p><div id="list"></div><p class="note">공식 자료를 확인한 일부 기관입니다. 현재 반·비용은 상세에서 확인하세요.</p><section class="public"><h2>공공 프로그램도 살펴보기 →</h2><p>공식 목록에서 현재 접수 가능한 프로그램을 확인해요.</p><div id="public-links"></div></section><div id="floating"></div><p class="note">관심 목록은 이 기기에 저장되는 시연용입니다. 실제 아이·가족 계정과 연동하지 않아요.</p><dialog id="detail"></dialog><script src="reference.js"></script><script>
const R=EducationReference,v=new URLSearchParams(location.search).get('variant')||'A',fields=['수학','영어','과학','국어·독서'];let subject='',district='',savedOnly=false,compareIds=new Set(),compareNotice='';const saveKey='hannun-interest-design:v1:'+v;let saved=new Set();try{const x=JSON.parse(localStorage.getItem(saveKey)||'[]');if(Array.isArray(x))saved=new Set(x.filter(k=>typeof k==='string'));}catch(e){}function save(id){const next=new Set(saved);next.has(id)?next.delete(id):next.add(id);try{localStorage.setItem(saveKey,JSON.stringify([...next]));saved=next;for(const key of compareIds)if(!saved.has(key))compareIds.delete(key);compareNotice='';return true;}catch(e){alert('이 기기에 저장하지 못했어요.');return false;}}const bookmark=i=>`<button class="bookmark ${saved.has(i.id)?'on':''}" data-save="${esc(i.id)}" aria-label="${esc(i.name)} 관심 ${saved.has(i.id)?'해제':'저장'}" aria-pressed="${saved.has(i.id)}">${saved.has(i.id)?'♥':'♡'}</button>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortNames={'cms-bundang-sunae':'CMS 분당수내','J10:3000050173':'April 분당수내','J10:3000025694':'와이즈만 분당','J10:36022':'한우리 야탑','J10:3000067743':'한우리 금광동'};
const labels={수학:'수',영어:'영',과학:'과','국어·독서':'독'};
const row=i=>`<div class="interest-row">${v==='A'&&savedOnly?`<label class="compare-check"><input type="checkbox" data-compare-id="${esc(i.id)}" aria-label="${esc(i.name)} 비교 선택" ${compareIds.has(i.id)?'checked':''}></label>`:''}<button class="row" data-id="${esc(i.id)}"><span class="icon">${labels[i.subject]}</span><span class="info"><strong>${esc(i.name)}</strong><small>${esc(i.subject)} · ${esc(i.district)} · ${esc(i.address.split(' ')[0])}</small></span><span class="arrow">›</span></button>${v==='A'?bookmark(i):v==='C'?`<button class="bookmark ${saved.has(i.id)?'on':''}" data-save="${esc(i.id)}" aria-label="${esc(i.name)} 관심 ${saved.has(i.id)?'해제':'저장'}">${saved.has(i.id)?'★':'☆'}</button>`:''}</div>`;
const options=(vals,current)=>vals.map(([val,label])=>`<option value="${esc(val)}" ${val===current?'selected':''}>${label}</option>`).join('');
function render(){document.querySelector('#compare-notice').textContent=compareNotice;const rows=document.querySelector('#region').value==='none'?[]:R.search({subject,district,query:document.querySelector('#query').value}).filter(i=>!savedOnly||saved.has(i.id));document.querySelector('#interest-control').innerHTML=v==='A'?`<div class="tabs"><button data-view="all" class="${!savedOnly?'on':''}">기관 찾기</button><button data-view="saved" class="${savedOnly?'on':''}">관심 학원 ${saved.size}</button></div>`:v==='B'?`<button class="collection" data-view="${savedOnly?'all':'saved'}">${savedOnly?'← 기관 찾기로':'♥ 관심 학원 모아보기'} <b>${saved.size}</b></button>`:`<p class="note">${savedOnly?'저장한 관심 학원만 보는 중':'별을 눌러 나중에 볼 기관을 저장해요.'}</p>`;document.querySelector('#floating').innerHTML=v==='A'&&savedOnly?`<div class="compare-dock"><small>${compareIds.size}/3곳 선택 · 최대 3곳</small><button data-open-compare ${compareIds.size<2?'disabled':''}>${compareIds.size<2?'2~3곳을 선택하세요':'선택한 '+compareIds.size+'곳 비교하기'}</button></div>`:v==='C'?`<button class="floating" data-view="${savedOnly?'all':'saved'}">${savedOnly?'전체 기관 보기':'★ 관심 학원 보기'} · ${saved.size}</button>`:'';document.querySelector('#count').textContent=rows.length+'곳';document.querySelector('#filters').innerHTML=v==='B'?`<div class="chips">${['',...fields].map(s=>`<button data-subject="${s}" class="${s===subject?'on':''}">${s||'전체'}</button>`).join('')}</div><div class="filters"><select id="district" aria-label="구">${options([['','성남시 전체'],...['분당구','중원구','수정구'].map(x=>[x,x])],district)}</select></div>`:`<div class="filters">${v==='A'?`<select id="subject" aria-label="분야">${options([['','모든 분야'],...fields.map(x=>[x,x])],subject)}</select>`:''}<select id="district" aria-label="구">${options([['','성남시 전체'],...['분당구','중원구','수정구'].map(x=>[x,x])],district)}</select></div>`;
document.querySelector('#list').innerHTML=!rows.length?(savedOnly?'<div class="empty">이 조건에 저장한 관심 학원이 없어요.</div>':'<div class="empty">이 조건의 조사 자료를 아직 확보하지 못했어요.<br>기관이 없다는 뜻은 아니에요.</div>'):false?`<div class="tiles">${rows.map(i=>`<button class="tile" data-id="${esc(i.id)}"><span class="tag">${esc(i.subject)}</span><strong>${esc(shortNames[i.id]||i.name)}</strong><small>${esc(i.district)} · 상세 보기 ›</small></button>`).join('')}</div>`:false?fields.map((s,idx)=>{const items=rows.filter(i=>i.subject===s);return items.length?`<details class="group" ${idx===0?'open':''}><summary><span>${s}<em>${items.length}곳</em></span></summary>${items.map(row).join('')}</details>`:''}).join(''):`<div class="rows">${rows.map(row).join('')}</div>`;
}
function openComparison(){const items=R.institutions.filter(i=>saved.has(i.id)&&compareIds.has(i.id));if(items.length<2||items.length>3)return;const d=document.querySelector('#detail');const rows=[['분야',i=>i.subject],['지역·주소',i=>i.district+' '+i.address],['대상·과정',i=>i.target],['수업 방식',i=>i.course||'확인 필요'],['비용',i=>i.fee],['수업 시간',i=>i.hours],['차량',i=>i.transport],['이용자 의견',()=> '검증된 의견 자료 없음'],['등록 확인',i=>i.registration]];d.classList.add('compare-dialog');d.innerHTML=`<button class="close" aria-label="닫기">×</button><h2 class="detail-title">관심 학원 ${items.length}곳 비교</h2><p class="note">확인된 범위만 비교해요. 비용의 기간·회차·추가비는 원문에서 확인하세요.</p><div class="comparison-scroll"><table><thead><tr><th>항목</th>${items.map(i=>`<th>${esc(i.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(([label,get])=>`<tr><th>${label}</th>${items.map(i=>`<td>${esc(get(i)||'확인 필요')}</td>`).join('')}</tr>`).join('')}<tr><th>공식 출처</th>${items.map(i=>`<td><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">원문 확인 ↗</a></td>`).join('')}</tr></tbody></table></div><p class="note">자료 확인 ${esc(R.checkedAt)} · 순위·적합도 판정 없음</p>`;d.querySelector('.close').onclick=()=>{d.close();d.classList.remove('compare-dialog')};d.showModal()}
document.querySelector('#public-links').innerHTML=R.publicLinks.map(p=>`<a target="_blank" rel="noopener noreferrer" href="${esc(p.url)}">${esc(p.name.replace('경기도교육청','').replace('성남시청소년재단','청소년재단'))} ↗</a>`).join('');
document.querySelector('#filters').onchange=e=>{if(e.target.id==='subject')subject=e.target.value;if(e.target.id==='district')district=e.target.value;render()};document.querySelector('#filters').onclick=e=>{if(e.target.dataset.subject!==undefined){subject=e.target.dataset.subject;render()}};document.querySelector('#query').oninput=render;document.querySelector('#region').onchange=render;
document.querySelector('#list').onclick=e=>{const box=e.target.closest('[data-compare-id]');if(box){if(compareIds.has(box.dataset.compareId)){compareIds.delete(box.dataset.compareId);compareNotice='';}else if(compareIds.size<3){compareIds.add(box.dataset.compareId);compareNotice='';}else{compareNotice='한 번에 최대 3곳까지 비교할 수 있어요. 선택한 곳을 해제해 주세요.';}render();return;}const fav=e.target.closest('[data-save]');if(fav){save(fav.dataset.save);render();return;}const b=e.target.closest('[data-id]');if(!b)return;const i=R.institutions.find(x=>x.id===b.dataset.id),d=document.querySelector('#detail');d.classList.remove('compare-dialog');d.innerHTML=`<button class="close" aria-label="닫기">×</button><p class="detail-tag">${esc(i.subject)} · ${esc(i.district)}</p><h2 class="detail-title">${esc(i.name)}</h2><button class="collection detail-save" data-detail-save="${esc(i.id)}">${saved.has(i.id)?'♥ 관심 학원 저장됨 · 해제':'♡ 관심 학원 저장'}</button><p class="address">성남시 ${esc(i.district)} ${esc(i.address)}</p><dl class="facts">${[['대상·과정',i.target],['비용',i.fee],['시간·차량',i.hours+' / '+i.transport],['등록 확인',i.registration]].map(([k,val])=>`<div><dt>${k}</dt><dd>${esc(val)}</dd></div>`).join('')}</dl><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">공식 안내 ↗</a><details><summary class="address">상담에서 확인할 질문</summary><ul class="questions"><li>실제 학년·경험에 맞는 반과 현재 모집 여부</li><li>요일·시간과 교재·재료·차량을 포함한 총액</li><li>체험 가능일·비용·취소 조건</li></ul></details><p class="note">자료 확인 ${R.checkedAt} · 현재 조건 재확인 필요</p><button class="action">상담 일정 준비</button>`;d.querySelector('.close').onclick=()=>d.close();d.querySelector('[data-detail-save]').onclick=e=>{save(i.id);e.target.textContent=saved.has(i.id)?'♥ 관심 학원 저장됨 · 해제':'♡ 관심 학원 저장';render()};d.querySelector('.action').onclick=()=>{d.innerHTML='<button class="close" aria-label="닫기">×</button><h2 class="detail-title">상담 일정 준비</h2><p class="address">시안에서는 실제 일정을 저장하지 않습니다. 앱에서는 기관명·주소·확인 질문을 채운 일정 폼으로 이어집니다.</p>';d.querySelector('.close').onclick=()=>d.close()};d.showModal()};document.querySelector('#peer').onclick=()=>{const d=document.querySelector('#detail');d.classList.remove('compare-dialog');d.innerHTML='<button class="close" aria-label="닫기">×</button><h2 class="detail-title">또래·지역</h2><p class="address">이번 독립 시안은 관심 학원 저장·비교를 확인하는 화면입니다. 운영 통계 화면은 포함하지 않습니다.</p>';d.querySelector('.close').onclick=()=>d.close();d.showModal()};document.querySelector('#interest-control').onclick=document.querySelector('#floating').onclick=e=>{if(e.target.closest('[data-open-compare]')){openComparison();return;}const b=e.target.closest('[data-view]');if(b){savedOnly=b.dataset.view==='saved';subject='';district='';document.querySelector('#query').value='';document.querySelector('#region').value='seongnam';render()}};render();
</script></html>
