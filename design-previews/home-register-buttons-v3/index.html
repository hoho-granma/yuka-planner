<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 · 홈 등록 버튼 — 이름 정리 3안 + 작은 + 2안</title>
<style>
:root{--bg:#f4f2f7;--ink:#302c3c;--muted:#7a7488;--line:#ece8f2;--accent:#715697}
*{box-sizing:border-box}body{margin:0;background:#ebe8f1;color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo",Pretendard,system-ui,sans-serif}
.wrap{max-width:1380px;margin:0 auto;padding:22px 16px 70px}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.6}
.vs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}@media(max-width:1300px){.vs{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.vs{grid-template-columns:1fr 1fr}}@media(max-width:560px){.vs{grid-template-columns:1fr}}
.cap{font-size:13px;font-weight:800;text-align:center;margin:0 0 2px}.capsub{font-size:11px;color:var(--muted);text-align:center;margin:0 0 8px;min-height:44px;line-height:1.4}
.phone{background:var(--bg);border-radius:24px;border:7px solid #1e1b26;overflow:hidden;height:640px;display:flex;flex-direction:column;position:relative}
.status{height:20px;font-size:9px;color:var(--muted);display:flex;justify-content:space-between;padding:5px 14px 0}.scroll{flex:1;overflow:auto;padding:8px 10px 70px}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 0 9px;font-size:10px;color:var(--muted)}.tabbar b{color:var(--accent)}
.line{font-size:12px;color:var(--muted);margin:2px 4px 8px}.line b{color:var(--ink);font-size:13px}
.card{background:#fff;border-radius:16px;padding:12px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;min-height:28px}.head h3{margin:0;font-size:14px}.head h3 span{color:var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:2px 0 4px}.tabs button{flex:1;border:0;background:none;padding:8px 0 9px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);position:relative}.tabs button.on{color:var(--ink)}.tabs button.on:after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
.sr{display:flex;align-items:center;gap:7px;padding:8px 0;font-size:12.5px}.sr time{font-size:10.5px;font-weight:700;min-width:36px}.sr strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none}.c{background:#f7e8c9}.m{background:#f8d7c0}
.tag{display:inline-block;font-size:10.5px;font-weight:650;padding:3px 7px;border-radius:7px;white-space:nowrap}.k0{background:#f0ccdc;color:#40374b}.k1{background:#cadcf0;color:#40374b}.m4{background:#c04a7c;color:#fff}
.todo{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.todo:first-of-type{border-top:0}.todo .ck{width:24px;height:24px;border:2px solid #b8b0c8;border-radius:8px;flex:none}.todo span.t{flex:1;font-weight:650}
.rec{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:12.5px;cursor:pointer}.rec .dot{width:36px;height:36px;border-radius:11px;background:#e4f1e9;display:grid;place-items:center;font-size:17px;flex:none}.rec small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}.rec strong{font-weight:650}.rec .arrow{margin-left:auto;color:var(--muted)}
.grsum{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:6px 0 2px;cursor:pointer}.grsum b{color:var(--ink)}.grsum .arrow{color:var(--muted)}
button{font-family:inherit;cursor:pointer}
/* v1 작은 둥근 네모 윤곽 */
.v1 .b{width:24px;height:24px;border-radius:8px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);font-size:17px;line-height:20px;padding:0;font-weight:600}
/* v2 작은 원형 채움 */
.v2 .b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:18px;line-height:22px;padding:0;font-weight:600}
/* v3 텍스트 링크 */
.v3 .b{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:800;padding:4px 0}
/* v4 연보라 네모(윤곽 없음) */
.vt .b{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:800;padding:4px 0}
.vd .b{width:20px;height:20px;border-radius:7px;background:#ece4f7;color:var(--accent);border:0;font-size:15px;line-height:19px;padding:0;font-weight:700}
.ve .b{width:18px;height:18px;border-radius:6px;background:#ece4f7;color:var(--accent);border:0;font-size:14px;line-height:17px;padding:0;font-weight:700}
.v4 .b{width:24px;height:24px;border-radius:8px;background:#ece4f7;color:var(--accent);border:0;font-size:17px;line-height:22px;padding:0;font-weight:700}
/* v5 연보라 알약 */
.v5 .b{border:0;border-radius:99px;background:#ece4f7;color:var(--accent);font-size:11.5px;font-weight:800;padding:5px 10px}
</style></head><body><div class="wrap">
<h1>시안 · 홈 등록 버튼 — 이름 정리 3안 + 작은 + 2안</h1>
<p class="sub"><b>A~C</b>: 3번(텍스트 링크)을 유지하면서 영역 이름과 버튼 글자가 겹치지 않게 정리한 3가지 이름안. <b>D·E</b>: 4번(연보라 네모 +)을 더 작게(20px · 18px)한 안. 버튼은 모두 같은 보라색, 성장기록 카드는 흰 배경이고, 아래에는 이모지 없이 저장된 기록 건수만 보여 줘요.</p>
<div class="vs" id="vs"></div></div>
<script>
const sr=(t,w,n,tag,k)=>`<div class="sr"><time>${t}</time><span class="face ${w}">${w==='c'?'👧':'👩'}</span><strong>${n}</strong><span class="tag ${k}">${tag}</span></div>`;
const card=(names,labels,plain)=>{const b=(i)=>plain?`<button class="b" aria-label="추가">+</button>`:`<button class="b">+ ${labels[i]}</button>`;
return `<p class="line"><b>수아</b> · 초3</p>
<div class="card"><div class="head"><h3><span>10/12(월)</span> ${names[0]}</h3>${b(0)}</div><div class="tabs"><button class="on">오늘</button><button>내일</button><button>모레</button></div>${sr('09:00','c','학교 현장학습','학교','k0')}${sr('16:00','c','수학 학원','학원','k1')}${sr('18:00','m','퇴근 후 장보기','기타','m4')}</div>
<div class="card"><div class="head"><h3>${names[1]}</h3>${b(1)}</div><div class="todo"><span class="ck"></span><span class="t">준비물 챙기기</span><span class="tag k0">학교</span></div><div class="todo"><span class="ck"></span><span class="t">학원 숙제</span><span class="tag k1">학원</span></div></div>
<div class="card"><div class="head"><h3>🌱 ${names[2]}</h3>${b(2)}</div><div class="grsum"><span>총 <b>12건</b>의 기록이 저장되어 있어요</span><span class="arrow">›</span></div></div>`};
const V=[
['A · 영역 이름 바꾸기','가족 캘린더 · 챙길 것 · 성장 이야기 / 버튼은 "+ 일정 · + 할일 · + 기록"',['가족 캘린더','챙길 것','수아의 성장 이야기'],['일정','할일','기록'],false,'vt'],
['B · 이름 유지 + 버튼 "+ 추가"','영역 이름은 지금 그대로, 버튼 글자만 세 곳 모두 "+ 추가"로 통일',['우리 가족 일정','우리 가족 할일','수아의 성장기록'],['추가','추가','추가'],false,'vt'],
['C · 영역 이름 바꾸기 (안내형)','다가오는 가족 일정 · 함께 챙길 일 · 수아의 성장 노트 / 버튼은 "+ 등록" 통일',['다가오는 가족 일정','함께 챙길 일','수아의 성장 노트'],['등록','등록','등록'],false,'vt'],
['D · 4번 + 더 작게 (20px)','이름은 지금 그대로, 연보라 네모 +를 20px로',['우리 가족 일정','우리 가족 할일','수아의 성장기록'],null,true,'vd'],
['E · 4번 + 아주 작게 (18px)','같은 모양을 18px로 — 가장 조용하지만 누르기는 D보다 어려움',['우리 가족 일정','우리 가족 할일','수아의 성장기록'],null,true,'ve']];
document.getElementById('vs').innerHTML=V.map(v=>`<section class="${v[5]}"><p class="cap">${v[0]}</p><p class="capsub">${v[1]}</p><div class="phone"><div class="status"><span>9:41</span><span>LTE</span></div><div class="scroll">${card(v[2],v[3],v[4])}</div><div class="tabbar"><b>홈</b><span>캘린더</span><span>할일</span><span>교육정보</span></div></div></section>`).join('');
</script></body></html>
