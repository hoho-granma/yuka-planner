<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>운영 모듈 통합 검증</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/growth-records.css"><link rel="stylesheet" href="css/learning-check.css"><link rel="stylesheet" href="css/character-ui.css"><link rel="stylesheet" href="css/family-theme.css"><style>body{overflow:auto!important}main{max-width:480px;margin:auto;padding:15px}nav{display:flex;gap:10px;margin-bottom:12px}nav button{padding:12px;border:0;border-radius:12px}#education[hidden],#growth[hidden]{display:none!important}</style></head><body><main><p>운영 모듈 검증 · 수아 초3 참고용 · 실제 DB와 연결하지 않음</p><nav><button id="growth-tab">성장기록</button><button id="education-tab">교육정보</button></nav><div id="growth"></div><div id="education" hidden></div></main><script src="js/growth-evidence.js"></script><script src="js/growth-records.js"></script><script src="js/growth-learning-view.js"></script><script src="js/education-reference.js"></script><script src="js/education-reference-view.js"></script><script src="js/education-interests.js"></script><script src="js/education-info.js"></script><script>
// In-memory record backend: fixture data never touches production/IndexedDB.
let records=[],active='growth';const scope='runtime-integration-fixture:sua';const backend={pendingLocal:async()=>[],read:async()=>records,save:async r=>{records=records.filter(x=>x.id!==r.id).concat(r);return r;}};
function open(which){active=which;GrowthLearningView.unmount();EducationInfo.unmount();document.getElementById('growth').hidden=which!=='growth';document.getElementById('education').hidden=which!=='education';if(which==='growth')GrowthLearningView.mount(document.getElementById('growth'),{scope,name:'수아',familyId:'fixture',grade:3,semester:2,months:112,backend,isCurrent:()=>active==='growth',onEducation:()=>open('education')});else EducationInfo.mount(document.getElementById('education'),{scope,name:'수아',familyId:'fixture',provinceName:'경기도',district:'성남시',region:'경기도 성남시',ageLabel:'초3 참고',months:112,isCurrent:()=>active==='education',onHistory:()=>open('growth')});}
document.getElementById('growth-tab').onclick=()=>open('growth');document.getElementById('education-tab').onclick=()=>open('education');open('growth');
</script></body></html>
