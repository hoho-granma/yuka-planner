<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교육정보 필터 UX 5안</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f8;color:#302b39;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:1060px;padding:24px 16px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:6px 0 20px;color:#78717f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.option{background:white;border:1px solid #e2dce9;border-radius:16px;padding:18px;min-width:0}.option h2{font-size:16px;margin:0 0 6px}.option>p{font-size:12px}.phone{background:#f5f3f8;border:1px solid #e4dfeb;border-radius:14px;max-width:410px;margin:auto;padding:14px 12px;min-width:0}.brand{font-size:19px;font-weight:700;margin-bottom:20px}.brand span{color:#8571a9}.tabs{display:flex;background:#eeebf2;padding:4px;border-radius:10px;margin-bottom:16px;gap:4px}.tabs button{flex:1;border:0;background:#eeebf2;color:#514b5c;min-height:40px;font:inherit;font-weight:600;border-radius:7px}.tabs button.on{background:white;color:#716092}.bar{display:flex;align-items:center;gap:6px;width:100%;min-height:42px;flex-wrap:nowrap}.bar button,.bar select,.bar input{font:inherit;font-size:12px;color:#514b5c;min-height:40px;border:1px solid #ddd6e6;border-radius:8px;background:#fff;padding:0 9px;min-width:0}.bar button{white-space:nowrap;cursor:pointer}.bar button.active{background:#eee8f5;border-color:#a28dbd;color:#716092;font-weight:700}.bar input{flex:1;width:0;outline-offset:2px}.bar select{max-width:116px}.bar .search{width:38px;flex-shrink:0;font-size:19px;padding:0}.count{font-size:11px;color:#857b90;margin:10px 0}.empty{border:1px solid #e4ddec;border-radius:10px;padding:20px 12px;background:white;color:#81798c;font-size:12px;text-align:center;min-height:110px}.switch{display:flex;gap:0;flex-shrink:0}.switch button{border-radius:0;border-right:0;padding:0 8px}.switch button:first-child{border-radius:8px 0 0 8px}.switch button:last-child{border-radius:0 8px 8px 0;border-right:1px solid #ddd6e6}.line{background:white;border:1px solid #ddd6e6;border-radius:9px;padding:0 5px;gap:2px}.line button,.line select,.line input{border:0;background:transparent;border-radius:5px;padding:0 7px}.line .sep{height:20px;border-left:1px solid #e4deea}.underline button{border:0;border-radius:0;background:transparent;padding:0 4px;border-bottom:2px solid transparent}.underline button.active{background:transparent;border-color:#9380b3}.selectbar .view{width:96px;max-width:96px}.selectbar .region{width:114px}.searchfield{display:flex;align-items:center;flex:1;min-width:0;border:1px solid #ddd6e6;border-radius:8px;background:#fff;padding-left:9px}.searchfield input{border:0}.circle button{border-radius:18px}.circle .search{border-radius:50%}.panel{margin-top:8px;background:white;border:1px solid #ded6e8;border-radius:9px;padding:10px}.panel label{display:block;font-size:12px;margin:5px 0}.panel select,.panel input{width:100%;padding:8px;border:1px solid #ddd6e6;border-radius:7px;font:inherit;background:white}.pick{margin-top:14px;font:inherit;font-size:12px;border:1px solid #a895bf;border-radius:8px;background:#fff;padding:8px 12px;color:#716092;cursor:pointer}.pick.selected{background:#eee8f5;font-weight:700}#selection{color:#716092;font-weight:600}.hint{font-size:12px}a{color:#716092}@media(max-width:750px){.grid{grid-template-columns:1fr}}@media(max-width:360px){.phone{padding:12px 8px}.bar{gap:4px}.bar button,.bar select,.bar input{font-size:11px;padding-left:6px;padding-right:6px}.switch button{padding:0 6px}.bar select{max-width:108px}}
</style><main><h1>교육 선택 · 한 줄 필터 5안</h1><p>전체·관심·지역·검색을 한 줄에 모았습니다. 각 시안의 버튼을 눌러 동작을 비교하세요.</p><p class="hint">거주지역 기본값은 성남시·분당구를 가정했습니다. 이 페이지는 배치 비교용이며 실시간 기관 목록이나 계정 데이터는 조회하지 않습니다. 관심 0, 조회 건수는 필터 줄 바깥에 표시합니다.</p><div id="selection" role="status"></div><div class="grid" id="options"></div><p><a href="../education-review/">기존 교육정보 시안 →</a> · <a href="../release-checklist/">개발 확인용 체크리스트 →</a></p></main><script>
const search='<button class="search" data-action="search" aria-label="기관 검색 열기">⌕</button>';
const region='<button data-action="region" aria-label="조회 지역 변경">성남·분당⌄</button>';
const switcher='<div class="switch"><button data-action="all" class="active" aria-pressed="true">전체</button><button data-action="saved" aria-pressed="false">관심</button></div>';
const designs=[
['01 분할 토글 + 검색창 · 추천','전체/관심을 바로 바꾸고, 같은 줄에서 검색합니다.',`<div class="bar">${switcher}${region}<input aria-label="기관명·주소 검색" placeholder="기관 검색"></div>`],
['02 하나의 통합 툴바','하나의 흰색 바 안에서 목록·지역·검색을 조작합니다.',`<div class="bar line"><button data-action="all" class="active" aria-pressed="true">전체</button><button data-action="saved" aria-pressed="false">관심</button><span class="sep"></span>${region}<span class="sep"></span><input aria-label="기관명·주소 검색" placeholder="검색"></div>`],
['03 텍스트 토글 + 검색 아이콘','버튼 배경을 줄이고 여백과 밑줄로 구분합니다.',`<div class="bar underline"><button data-action="all" class="active" aria-pressed="true">전체보기</button><button data-action="saved" aria-pressed="false">관심 학원</button><span style="flex:1"></span>${region}${search}</div>`],
['04 기본 지역 + 관심만 토글','전체가 기본입니다. 관심 버튼을 한 번 더 누르면 전체로 돌아갑니다.',`<div class="bar circle">${region}<button data-action="saved-only" aria-pressed="false">관심만</button><input aria-label="기관명·주소 검색" placeholder="기관 검색"></div>`],
['05 지역 중심 + 목록 토글','지역을 먼저 확인하고, 전체/관심은 오른쪽에서 선택합니다.',`<div class="bar">${region}<input aria-label="기관명·주소 검색" placeholder="검색">${switcher}${search}</div>`]
];
const grid=document.getElementById('options');for(const [title,desc,bar]of designs){const article=document.createElement('article');article.className='option';article.innerHTML=`<h2>${title}</h2><p>${desc}</p><div class="phone"><div class="brand">한눈육아 <span>· 수아네집</span></div><div class="tabs"><button>또래·지역</button><button class="on">교육 선택</button></div>${bar}<div class="panel" hidden></div><div class="count">성남시 분당구 · 전체 기관</div><div class="empty">실시간 목록을 넣지 않은 배치 시안입니다.</div></div><button class="pick">이 시안 선택</button>`;
const panel=article.querySelector('.panel'),count=article.querySelector('.count');let saved=false,currentRegion='성남시 분당구';function update(){count.textContent=currentRegion+' · '+(saved?'관심 학원 0곳':'전체 기관');for(const b of article.querySelectorAll('[data-action="all"],[data-action="saved"],[data-action="saved-only"]')){const on=b.dataset.action==='all'?!saved:saved;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));}}
article.onclick=e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(action==='all'||action==='saved'||action==='saved-only'){saved=action==='saved-only'?!saved:action==='saved';update();}if(action==='region'){panel.hidden=!panel.hidden;panel.innerHTML='<label>조회 지역<select aria-label="조회 지역"><option>성남시 분당구</option><option>성남시 전체</option><option>성남시 수정구</option><option>성남시 중원구</option></select></label>';panel.querySelector('select').value=currentRegion;panel.querySelector('select').onchange=e=>{currentRegion=e.target.value;article.querySelector('[data-action="region"]').textContent=(currentRegion==='성남시 전체'?'성남 전체':currentRegion.replace('성남시 ','성남·').replace('구',''))+'⌄';update();panel.hidden=true;};}if(action==='search'){panel.hidden=!panel.hidden;panel.innerHTML='<label>기관명·주소 검색<input placeholder="기관명 또는 주소" aria-label="기관 검색"></label>';if(!panel.hidden)panel.querySelector('input').focus();}if(b.classList.contains('pick')){for(const pick of document.querySelectorAll('.pick')){pick.classList.remove('selected');pick.textContent='이 시안 선택';}b.classList.add('selected');b.textContent='선택됨';document.getElementById('selection').textContent=title+' 선택';try{localStorage.setItem('hannun-education-filter-design',title)}catch(e){}}};grid.append(article);}
</script></html>
