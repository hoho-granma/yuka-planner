<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한눈육아 변경사항 확인</title><link rel="stylesheet" href="../../css/learning-check.css"><style>
:root{--bg:#f5f3f8;--card-bg:#fff;--text:#302b39;--accent:#8873ad;--on-accent:#fff;--border:#e2dce9;--text-muted:#77717f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:25px}h2{font-size:19px}section.review{background:white;border:1px solid var(--border);border-radius:16px;padding:20px;margin:18px 0}p.note{color:#77717f;font-size:13px}.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee;align-items:flex-start}.item input{margin-top:6px;accent-color:#8873ad}.item small{display:block;color:#77717f}.item:has(input:checked){color:#80778e}.item:has(input:checked) strong{text-decoration:line-through}button{font:inherit;cursor:pointer}a{color:#716092}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{border:1px solid #d7cfe2;background:white;padding:9px 12px;border-radius:9px}.choices button[aria-pressed=true]{border:2px solid #8873ad}.phone{max-width:430px;margin:20px auto;background:#f5f3f8;border:1px solid #ddd5e8;border-radius:20px;padding:16px 12px;min-height:400px}.brand{font-size:21px;font-weight:700;padding:8px 4px 18px}.brand span{color:#8571a9}.sand .ei-tabs,.sand .ei-tabs button{background:#f3ecdf}.sand .ei-tabs button[aria-pressed=true]{background:#e6dac6;color:#4a4035}.outline .ei-tabs{background:white;padding:0;border:0;gap:8px}.outline .ei-tabs button{background:white;border:1px solid #dcd5e7}.outline .ei-tabs button[aria-pressed=true]{background:#eee8f5;border:1px solid #8873ad}#count{color:#716092;font-weight:700}@media(min-width:850px){.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.layout section{align-self:start}}
</style><main><h1>개발 확인용 체크리스트</h1><p class="note">사용자 앱 화면과 별개입니다. 확인한 항목을 개발자에게 전달하는 용도로 사용하세요.</p><a href="../education-review/">교육정보 시안 열기 →</a><p>2026-10-08 · 오늘 push한 항목과 이번 교육정보 수정안을 구분해서 확인하세요.</p><p class="note">체크는 이 브라우저에만 저장됩니다. 체크했다고 운영 검증이 자동 완료되지는 않습니다.</p><div id="count" role="status"></div><div><div id="checks"></div></div></main>
<script>
const groups=[['오늘 push · 사용자 기능',[
['landing','온보딩·로그인','로고 진입, 가족코드 반복 입력 없이 시작되는지'],['time','날짜·시간 입력','24시간·분 단위 시간 선택과 저장 후 재조회'],['calendar','가족 캘린더','구성원별 일정, 카테고리 뱃지, 상세 제목 배경·닫기·반복 표시'],['category','대상별 카테고리','엄마·아빠·아이 연령·가족·기타의 6개 태그와 변경 저장'],['message','메시지 AI 분석','붙여넣기 → 분석 버튼 → 후보 확인 → 날짜·대상 수정 → 저장'],['photo','사진 OCR + AI 분석','사진 → OCR 완료 → 분석 버튼 → 후보 확인 → 저장. 자동 호출·자동 저장 없음'],['growth','성장기록 서버 저장','휴대폰에서 올린 본문·첨부를 다른 기기에서 같은 아이로 재조회'],['education','교육정보·관심 학원','또래·지역, 교육 선택, 관심 저장·최대 3곳 비교. 관심은 기기별 저장'],['update','앱 업데이트','v2.0.22 및 새 코드가 반영됐는지']]],['오늘 push · 보안·데이터 확인',[
['family','가족 데이터 분리','다른 가족·아이 자료가 보이지 않고 공유 가족 내 수정이 유지되는지'],['email','계정 이메일','accounts 이메일 정보 확인. 비밀번호는 Firebase Auth 관리'],['ai-security','AI 접근·제한','로그인·가족 권한 검사, 서버 비밀키, 일별 호출 제한. 사진 원본은 AI로 전송하지 않음'],['migration','컬렉션 전환','기존 일정·할일 저장 후 재조회와 성장기록 연결에 누락이 없는지']]],['이번 요청 · 로컬 수정 / 아직 push 전',[
['remove-header','교육정보 상단 삭제','이름·지역·나이·교육정보 제목 영역이 없는지'],['grade','학년 자동 선택','아이 프로필의 계산된 초등 학년이 기본 선택되고 다른 학년도 직접 선택 가능한지'],['legacy','기존 메뉴 삭제','현재 등록한 교육 일정·기존 안내 보기 영역이 없는지. 기존 데이터는 보존'],['tabs','불투명 탭 디자인','선택·비선택 탭 모두 배경이 있고 글씨가 읽히는지'],['directory','성남시 목록 표시 정정','조사 후보 5곳임을 명시하고 공식 전체 기관 조회 버튼과 공식 목록 링크를 제공하는지'],['survey','조사 연도 표시','2025년 조사 · 2026년 발표를 구분하는지']]],['남은 조건 · 아직 활성화하지 않음',[
['neis','성남시 전체 목록 API 연결','공식 API 총 응답 3,309건 확인 / 키 없는 호출은 5건만 반환. 키 등록 완료(사용자 확인). 전체 페이지 수집·개원 필터·중복 제거 구현. 함수 배포·실제 키 조회 검증 필요'],['approval','가족 가입 승인·App Check','관련 초안은 포함되어 있으나 운영 활성화·규칙 전환은 별도 검증 필요'],['assessment','교과 이해 확인지','교사 검토 전 초안이며 운영 능력 진단으로 활성화하지 않음']]]];
let state={};try{state=JSON.parse(localStorage.getItem('hannun-release-review-20261008')||'{}')}catch(e){}
const root=document.getElementById('checks');for(const [title,rows] of groups){const section=document.createElement('section');section.className='review';const h=document.createElement('h2');h.textContent=title;section.append(h);for(const [id,title,detail]of rows){const label=document.createElement('label');label.className='item';const input=document.createElement('input');input.type='checkbox';input.checked=!!state[id];input.onchange=()=>{state[id]=input.checked;try{localStorage.setItem('hannun-release-review-20261008',JSON.stringify(state))}catch(e){}count()};const text=document.createElement('span');const strong=document.createElement('strong');strong.textContent=title;const small=document.createElement('small');small.textContent=detail;text.append(strong,small);label.append(input,text);section.append(label)}root.append(section)}function count(){const all=[...root.querySelectorAll('input')];document.getElementById('count').textContent=`확인 ${all.filter(x=>x.checked).length} / ${all.length}`}count();
</script></html>
