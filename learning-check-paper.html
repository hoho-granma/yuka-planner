<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교과 이해 확인 · 문제지</title><style>body{font-family:Arial,'Apple SD Gothic Neo',sans-serif;color:#24252a;margin:0;background:#f4f3f1;line-height:1.7}main{max-width:800px;padding:24px;margin:auto}.toolbar{display:flex;gap:10px;padding:14px;background:white;position:sticky;top:0}button,select{font:inherit;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff}.question{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:20px 0}.answer{height:160px;border-bottom:1px solid #ddd;margin-top:15px;background:repeating-linear-gradient(white,white 31px,#eee 32px)}.notice{font-size:12px;color:#666}.prompt{white-space:pre-wrap}h3{font-size:16px}@media print{@page{size:A4;margin:16mm}body{background:white}main{padding:0}.toolbar{display:none}.question{break-inside:avoid;border:0;border-bottom:1px solid #ddd;padding:0 0 10mm}.answer{height:45mm}}</style></head><body><div class="toolbar"><select id="subject" aria-label="과목"><option>국어</option><option>수학</option><option>사회</option><option>영어</option><option>과학</option></select><button id="print">문제지 인쇄</button></div><main><h1 id="title"></h1><p>이름 __________　수행 날짜 __________</p><p class="notice">공립 3~4학년군 일부 교육과정 참고 · 교사 검토 전 자체 문항 · 전체 학년 수준을 판정하는 검사가 아닙니다.</p><div id="questions"></div></main><script src="js/learning-check-bank.js?v=1"></script><script>
const escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const select=document.getElementById('subject');const requested=new URLSearchParams(location.search).get('subject');if([...select.options].some(o=>o.value===requested))select.value=requested;
function render(){document.getElementById('title').textContent=select.value+' · 교과 이해 확인';document.getElementById('questions').innerHTML=LearningCheckBank.items.filter(q=>q.subject===select.value&&q.level==='reference').map((q,n)=>`<article class="question"><h3>${n+1}. ${escapeText(q.area)}</h3><p class="prompt">${escapeText(q.prompt)}</p><div class="answer"></div></article>`).join('');}select.onchange=render;document.getElementById('print').onclick=()=>window.print();render();
</script></body></html>
