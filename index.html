<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="한눈육아" />
<title>한눈육아 | 우리 아이 육아 통합 캘린더</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ff6a1a" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<script>/* G19: 계정 모드(기본 ON)에서는 옛 상황 선택 화면이 첫 그림부터 한 번도 보이지 않게 한다(js/feature-flags.js 와 같은 규칙: accounts="0" 일 때만 OFF) */try{if(localStorage.getItem("hannun_feature_accounts")!=="0")document.documentElement.classList.add("hnacc-default");}catch(e){document.documentElement.classList.add("hnacc-default");}</script>
<style>/* 인증 UI가 준비되기 전에는 옛 가족코드 시작 화면을 그리지 않는다. */html.hnacc-default #view-landing:not(.acct-on){visibility:hidden}</style>
<link rel="stylesheet" href="css/style.css?v=132" />
  <link rel="stylesheet" href="css/places.css?v=11" />
</head>
<body>
<script>/* D41 theme: 마지막 테마를 첫 그림 전에 붙인다(깜빡임 방지 — 기준은 앱이 아이 월령으로 다시 정한다) */try{var t=localStorage.getItem("hannun_theme_last");t=t==="forest"?"forest":"warm";document.body.classList.add("theme-"+t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="forest"?"#f6f8f5":"#fff8f0")}catch(e){document.body.classList.add("theme-warm")}</script>
  <main id="app">
    <!-- 1. 랜딩 -->
    <section id="view-landing" class="view">
      <div id="new-child-bar" class="new-child-bar hidden">
        <button type="button" id="btn-new-child-cancel" class="btn-text">← 취소</button>
        <span class="fine-print" id="new-child-note"></span>
      </div>
      <div class="hero">
        <h1 id="hero-title">아이 키우면서 챙겨야 할 모든 것<br /><span class="hl">한눈육아</span> 하나로.</h1>
        <p class="sub" id="hero-sub">아이 생년월일과 사는 지역만 알려주시면<br />건강검진·예방접종·육아 혜택·발달까지 한 캘린더에서 챙겨드려요.</p>
      </div>

      <div id="stage-choice" class="card form-card stage-choice">
        <p class="stage-question">지금 어떤 상황이세요?</p>
        <button type="button" class="stage-btn" data-stage="pregnant">
          <span class="stage-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="10" r="5"/><path d="M20 16c-4 1-6 5-6 10v8"/><path d="M20 16c4 0 7 3 8 7 2 1 4 4 4 8 0 5-4 8-9 8h-4"/><path d="M28 27c-2 1-3 3-3 5"/><path d="M14 34l-1 8M22 41l1 3"/></svg></span>
          <span><strong>임신 중이에요</strong><small>출산 예정일로 임신 중 혜택부터 챙겨요</small></span>
        </button>
        <button type="button" class="stage-btn" data-stage="born">
          <span class="stage-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="25" r="15"/><path d="M20 10c1-3 5-4 7-1"/><circle cx="18.5" cy="24" r="1.2" fill="currentColor"/><circle cx="29.5" cy="24" r="1.2" fill="currentColor"/><path d="M20 31c2.5 2.5 5.5 2.5 8 0"/></svg></span>
          <span><strong>아이가 태어났어요</strong><small>생년월일로 검진·접종·혜택을 챙겨요</small></span>
        </button>
      </div>
      <div id="beta-preview-slot"></div>

      <form id="query-form" class="card form-card hidden">
        <button type="button" id="btn-stage-back" class="btn-text stage-back">← 상황 다시 선택</button>
        <div class="field">
          <label for="childName" id="lbl-name">아이 이름 또는 별칭 <span class="req">*</span></label>
          <input type="text" id="childName" maxlength="12" placeholder="예: 하은이, 콩이" required />
        </div>

        <div class="field">
          <label for="birthDateBtn" id="lbl-birth">아이 생년월일 <span class="req">*</span></label>
          <div class="date-picker-wrap">
            <button type="button" id="birthDateBtn" class="date-picker-trigger">
              <span id="birthDateDisplay" class="placeholder">날짜를 선택해주세요</span>
              <span class="date-picker-icon">📅</span>
            </button>
            <input type="hidden" id="birthDate" />
            <div id="birthDatePopup" class="date-popup hidden">
              <div class="date-popup-header">
                <button type="button" class="btn-icon" id="dp-prev-year">«</button>
                <button type="button" class="btn-icon" id="dp-prev-month">‹</button>
                <select id="dp-year"></select>
                <select id="dp-month"></select>
                <button type="button" class="btn-icon" id="dp-next-month">›</button>
                <button type="button" class="btn-icon" id="dp-next-year">»</button>
              </div>
              <div class="date-popup-weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
              </div>
              <div class="date-popup-grid" id="dp-grid"></div>
            </div>
          </div>
        </div>

        <div class="field" id="field-order">
          <label id="lbl-order">몇째 아이인가요? <span class="req">*</span></label>
          <div class="order-chips" id="order-chips" role="radiogroup" aria-labelledby="lbl-order">
            <button type="button" class="order-chip" role="radio" data-value="first"><span class="order-num">1</span>첫째</button>
            <button type="button" class="order-chip" role="radio" data-value="second"><span class="order-num">2</span>둘째</button>
            <button type="button" class="order-chip" role="radio" data-value="third"><span class="order-num">3</span>셋째</button>
            <button type="button" class="order-chip" role="radio" data-value="fourthPlus"><span class="order-num">4+</span>넷째 이상</button>
          </div>
          <select id="birthOrder" class="native-hidden" tabindex="-1" aria-hidden="true">
            <option value="" disabled selected></option>
            <option value="first">첫째</option>
            <option value="second">둘째</option>
            <option value="third">셋째</option>
            <option value="fourthPlus">넷째 이상</option>
          </select>
        </div>

        <div class="field" id="field-region">
          <label id="lbl-region">우리 동네는 어디예요? <span class="req">*</span></label>
          <div class="region-step-label">시·도</div>
          <div class="region-chips" id="province-chips" role="radiogroup" aria-label="시·도"></div>
          <div id="district-wrap" class="district-wrap hidden">
            <div class="region-step-label">시·군·구</div>
            <div class="region-chips district-chips" id="district-chips" role="radiogroup" aria-label="시·군·구"></div>
          </div>
          <div id="region-summary" class="region-summary hidden">📍 <strong id="region-summary-text"></strong></div>
          <select id="province" class="native-hidden" tabindex="-1" aria-hidden="true">
            <option value="" disabled selected></option>
          </select>
          <select id="district" class="native-hidden" tabindex="-1" aria-hidden="true" disabled>
            <option value="" disabled selected></option>
          </select>
          <p class="region-hint" id="region-hint">📍 선택한 지역의 지원 제도·혜택도 함께 확인할 수 있어요.</p>
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">우리 아이 맞춤 육아 일정 만들기</button>
        <p class="fine-print" id="entry-fine-print">회원가입 없이 바로 시작해요. 가족코드로 다른 기기에서도 이어볼 수 있어요.</p>
      </form>

      <button type="button" id="btn-show-code-entry" class="btn-text" style="display:block;margin:4px auto 0;">이미 가족코드가 있으신가요?</button>
      <div id="code-entry" class="card form-card hidden" style="margin-top:12px;">
        <div class="field">
          <label for="familyCodeInput">가족코드 입력</label>
          <input type="text" id="familyCodeInput" maxlength="8" placeholder="예: 4F2K9X" style="text-transform:uppercase;" />
        </div>
        <div id="hh-code-hint"></div>
        <div id="beta-landing-slot"></div>
        <button type="button" id="btn-load-code" class="btn-primary">불러오기</button>
        <p id="code-error" class="fine-print hidden" style="color:var(--c-danger);">코드를 찾을 수 없어요. 다시 확인해주세요.</p>
      </div>
    </section>

    <!-- 2. 대시보드: 하단 탭 4개(홈·캘린더·기록·지원금) + 전체 할 일 서브 화면 -->
    <section id="view-calendar" class="view hidden">
      <header class="app-header">
        <button type="button" class="app-title app-brand-btn" id="brand-text" aria-label="한눈육아 소개 화면 열기">한눈육아</button>
        <div class="header-actions">
          <button type="button" class="btn-refresh" id="btn-refresh" aria-label="최신 버전으로 새로고침">
            <span class="refresh-icon" aria-hidden="true">↻</span><span id="app-version-text"></span>
          </button>
          <button type="button" class="btn-add-child" id="btn-add-child" aria-label="새 아이 추가">+</button>
        </div>
      </header>

      <!-- 아이가 없는 홈(계정으로 가입한 뒤 아이를 아직 등록하지 않았을 때만 보인다) -->
      <div id="empty-panel" class="tab-panel hidden"></div>

      <!-- 홈 -->
      <div id="tab-home" class="tab-panel">
        <div class="profile-row">
          <button type="button" class="profile-card" id="btn-profile-card">
            <span class="avatar" id="profile-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="person-icon"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
            </span>
            <span class="profile-text">
              <strong id="profile-name-age"></strong>
              <span class="profile-location">📍 <span id="profile-location-text"></span></span>
            </span>
            <span class="chevron">›</span>
          </button>
        </div>
        <div id="home-body"></div>
      </div>

      <!-- 캘린더 -->
      <div id="tab-calendar" class="tab-panel hidden">
        <div class="card cal-progress-card" id="cal-progress-card">
          <div class="cal-progress-row">
            <span class="progress-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
            </span>
            <strong id="cal-progress-summary"></strong>
          </div>
          <div class="progress-bar cal-progress-bar">
            <span class="progress-bar-fill" id="cal-progress-bar-fill"></span>
            <span class="cal-progress-bar-label" id="cal-progress-bar-label"></span>
          </div>
          <div class="cal-legend" id="cal-legend"></div>
        </div>

        <div id="cal-todo-slot"></div>
        <div id="us-filter-slot"></div>
        <div class="card calendar-card">
          <div id="cal-view-slot"></div>
          <div class="calendar-nav">
            <button id="btn-prev-month" class="btn-icon" aria-label="이전 달">◀</button>
            <h2 id="calendar-title"></h2>
            <button id="btn-next-month" class="btn-icon" aria-label="다음 달">▶</button>
          </div>
          <div class="calendar-weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div id="calendar-grid" class="calendar-grid calendar-grid-v2"></div>
        </div>

        <div id="auto-period-slot"></div>
        <div id="us-period-slot"></div>
        <div class="card selected-day-card">
          <div class="selected-day-handle"></div>
          <h3 id="selected-day-title">선택한 날짜</h3>
          <div id="selected-day-list" class="event-list"></div>
          <p id="selected-day-empty" class="empty hidden">이 날 표시할 항목이 없어요.</p>
          <div id="us-add-slot"></div>
        </div>
      </div>

      <!-- 전체 할 일(서브 화면 — 홈의 "전체 할 일 보기"로 들어온다) -->
      <div id="tab-checklist" class="tab-panel hidden">
        <div class="sub-header">
          <button type="button" class="btn-back hidden" id="btn-todos-back">‹ 홈</button>
          <h2>체크리스트</h2>
        </div>
        <div class="scope-banner hidden" id="checklist-scope-banner"><span class="scope-label"></span><button type="button" id="btn-scope-clear">전체 할 일 보기</button></div>
        <div class="status-filter" id="status-filter-checklist" role="tablist" aria-label="완료 상태">
          <button type="button" class="sf-btn" data-status="all">전체</button>
          <button type="button" class="sf-btn" data-status="todo">미완료</button>
          <button type="button" class="sf-btn" data-status="done">완료</button>
        </div>
        <div class="filter-chips" id="filter-chips-checklist"></div>
        <div id="list-checklist" class="event-list"></div>
        <p id="empty-checklist" class="empty hidden">해당하는 항목이 없어요.</p>
      </div>

      <!-- 어디갈까(가족 캘린더·계정 기능이 켜졌을 때만 하단 탭에 나온다) -->
      <div id="tab-places" class="tab-panel hidden">
        <div class="sub-header"><h2>어디갈까?</h2></div>
        <div id="places-body"></div>
      </div>

      <div id="tab-growth" class="tab-panel hidden"><div id="growth-body"></div></div>

      <!-- 지원금·제도 -->
      <div id="tab-subsidy" class="tab-panel hidden">
        <div class="segmented-tabs" id="subsidy-seg" role="tablist" aria-label="신청 상태"></div>
        <div class="filter-chips subsidy-scope" id="subsidy-scope"></div>
        <div id="subsidy-body"></div>
      </div>

      <nav class="bottom-nav" aria-label="주요 화면">
        <button type="button" class="nav-item" data-nav="home">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></span>
          <span>홈</span>
        </button>
        <button type="button" class="nav-item" data-nav="calendar">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>
          <span>캘린더</span>
        </button>
        <button type="button" class="nav-item" data-nav="checklist">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg></span>
          <span>체크리스트</span>
        </button>
        <button type="button" class="nav-item" data-nav="subsidy">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/></svg></span>
          <span>육아 혜택</span>
        </button>
        <button type="button" class="nav-item hidden" data-nav="places">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 1 0-13 0c0 5.4 6.5 11 6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span>
          <span>어디갈까</span>
        </button>
        <button type="button" class="nav-item hidden" data-nav="growth"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9M12 15C5 15 3 10 3 5c6 0 9 3 9 10zM12 12c0-6 4-9 9-9 0 6-3 9-9 9z"/></svg></span><span>성장기록</span></button>
      </nav>
    </section>
  </main>

    <div class="modal-panel" id="modal-content"></div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
          .then((reg) => reg.update())
          .catch((e) => console.error("서비스워커 등록 실패", e));
        // 새 버전이 배포돼 서비스워커가 교체되면 한 번만 새로고침해서 바로 최신 화면을 보여준다.
        let reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController || reloaded) return;
          reloaded = true;
          location.reload();
        });
      });
    }
  </script>
