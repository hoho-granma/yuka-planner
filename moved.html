<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>한눈육아 | 주소 변경</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f3f1;color:#24252a;font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  main{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e4e2de;border-radius:16px;padding:28px 22px;text-align:center}
  h1{margin:0 0 6px;font-size:22px}
  .url{display:block;margin:14px 0;padding:12px;background:#ffe2d0;border-radius:12px;font-weight:700;word-break:break-all}
  p{margin:8px 0;color:#53555c;font-size:14px}
  button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:#ff6a1a;color:#fff;font-size:16px;font-weight:700}
  button[disabled]{background:#c9c7c3}
  #status{min-height:22px;font-size:13px;color:#53555c}
</style>
</head>
<body>
<main>
  <h1>주소가 변경되었어요</h1>
  <p>한눈육아가 새 주소로 이사했어요.</p>
  <span class="url">yuka-planner.web.app</span>
  <p id="status">새 주소로 이동하면 이 기기에 저장된 내용도 함께 옮겨요.</p>
  <button id="go">새 주소로 이동</button>
  <p>로그인은 새 주소에서 한 번 더 해 주세요. 계정에 저장된 일정·할 일은 그대로예요.<br>홈 화면에 추가해 쓰셨다면 새 주소에서 다시 추가해 주세요.</p>
</main>
<script src="js/origin-move.js"></script>
<script>
(function () {
  var NEW = OriginMove.NEW_ORIGIN + "/" + location.search + location.hash, status = document.getElementById("status"), go = document.getElementById("go");
  go.onclick = function () {
    go.disabled = true; status.textContent = "저장된 내용을 새 주소로 옮기는 중이에요… (열린 작은 창은 자동으로 닫혀요)";
    OriginMove.send(window, 15000).then(function (r) {
      status.textContent = r.ok ? "옮겼어요. 새 주소로 이동할게요." : "저장된 내용을 옮기지 못했어요. 로그인하면 계정 데이터는 그대로 보여요.";
      setTimeout(function () { location.href = NEW; }, r.ok ? 700 : 2500);
    });
  };
})();
</script>
</body>
</html>
