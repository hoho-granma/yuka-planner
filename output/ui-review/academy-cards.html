<style>
#academy-cards .screen{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#f5f4f7;color:#302c3c;max-width:410px;margin:0 auto;padding:22px 16px;box-sizing:border-box;min-height:850px}#academy-cards h2{font-size:22px;margin:0 0 18px;font-weight:700}#academy-cards .tabs{display:flex;gap:4px;background:#eae6ee;padding:4px;border-radius:10px;margin-bottom:14px}#academy-cards button{font:inherit;color:inherit;cursor:pointer}#academy-cards .tabs button{flex:1;border:0;border-radius:7px;padding:10px;background:transparent;font-size:13px}#academy-cards .tabs button:first-child{background:#fff;font-weight:700}#academy-cards input{width:100%;box-sizing:border-box;border:1px solid #ddd7e4;border-radius:8px;background:#fff;padding:11px;font-size:16px;margin-bottom:10px}#academy-cards .regions{display:flex;align-items:center;gap:5px;margin-bottom:10px;font-size:12px}#academy-cards .regions button{padding:8px;border:1px solid #ddd7e4;border-radius:5px;background:#fff;font-size:12px}#academy-cards .regions .on{background:#715697;color:#fff;border-color:#715697}#academy-cards .subjects{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:18px}#academy-cards .subjects button{min-width:0;padding:8px 0;border:1px solid #ddd7e4;border-radius:5px;background:#fff;font-size:11px;white-space:nowrap}#academy-cards .subjects .on{background:#715697;color:#fff}#academy-cards .count{font-size:12px;color:#696272;margin:0 0 10px}#academy-cards .rows{background:#fff;border:1px solid #e3deea;border-radius:16px;overflow:hidden}#academy-cards .row{display:flex;align-items:center;gap:10px;padding:17px 12px;border-top:1px solid #ece8ef}#academy-cards .row[hidden]{display:none}#academy-cards .row:first-child{border-top:0}#academy-cards .subject-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--soft);color:var(--ink);border-radius:9px}#academy-cards .subject-icon svg{width:19px;height:19px}#academy-cards .body{min-width:0;flex:1}#academy-cards .open{width:100%;text-align:left;padding:0;border:0;background:none}#academy-cards .title{display:flex;align-items:center;gap:6px;min-width:0}#academy-cards strong{font-size:14px;line-height:1.5;font-weight:700;overflow-wrap:anywhere}#academy-cards .kind{font-size:10px;line-height:1.5;padding:2px 4px;border-radius:4px;background:#e9e1f3;color:#604584;flex-shrink:0}#academy-cards .office{background:#deeee8;color:#316352}#academy-cards .address{display:block;margin-top:5px;font-size:12px;line-height:1.6;color:#6e6877;overflow-wrap:anywhere}#academy-cards .heart{border:0;background:none;padding:7px 0;font-size:20px;color:#a299af;flex-shrink:0}#academy-cards .outlined .subject-icon{background:transparent;border:1px solid var(--ink);border-radius:50%;box-sizing:border-box}#academy-cards .outlined .kind{background:transparent;border:1px solid #c4b5d7;color:#604584}#academy-cards .outlined .office{border-color:#a4cbb9;color:#316352}#academy-cards .outlined .row{padding:19px 12px}#academy-cards .separate .rows{background:transparent;border:0;border-radius:0}#academy-cards .separate .row{background:#fff;border:1px solid #e3deea;border-radius:12px;margin-bottom:9px;padding:14px 12px;position:relative;overflow:hidden}#academy-cards .separate .row:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}#academy-cards .separate .subject-icon{border-radius:7px}#academy-cards .minimal .subject-icon{background:none;width:25px;border-radius:0}#academy-cards .minimal .rows{background:transparent;border:0;border-radius:0}#academy-cards .minimal .row{border-color:#ddd7e4;padding:18px 0}#academy-cards .minimal .kind{border-radius:2px;padding:1px 4px}#academy-cards .minimal .address{margin-top:7px}#academy-cards .detail{margin-top:12px;background:#fff;border:1px solid #ddd7e4;border-radius:12px;padding:14px;font-size:13px}#academy-cards .detail[hidden]{display:none}
</style>
<div id="academy-cards" class="viz-carousel viz-dotted-background" aria-label="교육 선택 학원 카드 디자인" data-previous-label="이전" data-next-label="다음">
<section data-variant="부드러운 목록"><div class="screen soft"></div></section>
<section data-variant="선형 아이콘"><div class="screen outlined"></div></section>
<section data-variant="독립 카드"><div class="screen separate"></div></section>
<section data-variant="간결한 리스트"><div class="screen minimal"></div></section>
</div>
<template id="academy-card-shell">
<h2>교육 정보</h2><div class="tabs"><button>교육 선택</button><button>교육 트렌드</button></div><input aria-label="기관명·주소 검색" placeholder="기관명·주소 검색"><div class="regions"><span>성남시</span><button>전체</button><button class="on">분당구</button><button>수정구</button><button>중원구</button></div><div class="subjects"><button class="on">전체</button><button>수학</button><button>영어</button><button>과학</button><button>국어</button><button>예술</button><button>체육</button></div><p class="count">시안용 예시 기관 · 6곳</p><div class="rows"></div><div class="detail" hidden role="status"></div>
</template>
<script>
(function(){const root=document.getElementById('academy-cards');const records=[{name:'판교 수학학원 예시',kind:'학원',subject:'수학',address:'분당구 판교역로14번길 20 103호, 백현동',icon:'calculator',ink:'#715697',soft:'#eee6f5'},{name:'백현 영어교습소 예시',kind:'교습소',subject:'영어',address:'분당구 동판교로 52 2층, 백현동',icon:'languages',ink:'#3974a5',soft:'#e5eef6'},{name:'정자 예술학원 예시',kind:'학원',subject:'예술',address:'분당구 정자일로 120 301호, 정자동',icon:'palette',ink:'#ae5b6f',soft:'#f7e7ec'},{name:'수내 체육학원 예시',kind:'학원',subject:'체육',address:'분당구 돌마로 80 2층, 수내동',icon:'dumbbell',ink:'#398265',soft:'#e4f0e9'},{name:'분당 과학교습소 예시',kind:'교습소',subject:'과학',address:'분당구 불정로 100 202호, 정자동',icon:'flask-conical',ink:'#a27b23',soft:'#f6efdb'},{name:'서현 국어학원 예시',kind:'학원',subject:'국어',address:'분당구 서현로 200 401호, 서현동',icon:'book-open',ink:'#93684b',soft:'#f0e8df'}];
root.querySelectorAll('.screen').forEach(screen=>{screen.append(document.getElementById('academy-card-shell').content.cloneNode(true));const list=screen.querySelector('.rows');records.forEach(r=>{const row=document.createElement('div');row.className='row';row.dataset.subject=r.subject;row.style.setProperty('--ink',r.ink);row.style.setProperty('--soft',r.soft);row.innerHTML=`<span class="subject-icon" aria-label="${r.subject}"><i data-lucide="${r.icon}" aria-hidden="true"></i></span><div class="body"><button class="open" aria-label="${r.name} 상세보기"><span class="title"><span class="kind ${r.kind==='교습소'?'office':''}">${r.kind}</span><strong>${r.name}</strong></span><span class="address">${r.address}</span></button></div><button class="heart" aria-label="${r.name} 관심 저장" aria-pressed="false">♡</button>`;row.querySelector('.heart').onclick=e=>{const b=e.currentTarget;const yes=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',yes);b.textContent=yes?'♥':'♡';};row.querySelector('.open').onclick=()=>{const box=screen.querySelector('.detail');box.hidden=false;box.textContent=r.name+' · '+r.address;};list.append(row);});const apply=()=>{const filter=screen.querySelector('.subjects .on').textContent;const q=screen.querySelector('input').value.trim();screen.querySelectorAll('.row').forEach(row=>row.hidden=!(filter==='전체'||row.dataset.subject===filter)||!row.textContent.includes(q));};screen.querySelector('input').oninput=apply;screen.querySelectorAll('.subjects button').forEach(b=>b.onclick=()=>{screen.querySelectorAll('.subjects button').forEach(x=>x.classList.toggle('on',x===b));apply();});});
if(globalThis.lucide)lucide.createIcons();
})();
</script>
